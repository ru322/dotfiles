# Satori Hyprland configuration.
#
# Ported from common/.config/niri/config.kdl. Niri itself is kept in the
# repository (and remains installed as a fallback session); Hyprland is the
# default session.
#
# Modes (submaps):
#   SUPER + R       resize mode   (H/J/K/L or arrows, Escape/Return to leave)
#   SUPER + M       move mode     (H/J/K/L or arrows, Escape/Return to leave)
#   SUPER + Escape  system mode   (L lock, E logout, S suspend, R reboot, P poweroff)
#
# Hyprland 0.56 reads this as ~/.config/hypr/hyprland.conf (installed by
# machines/Satori/home.nix). The legacy hyprlang syntax is still supported for
# .conf files; window/layer rules use the 0.53+ syntax.

$mainMod = SUPER
$terminal = kitty
$fileManager = kitty --class kitty-yazi yazi
$launcher = noctalia msg panel-toggle launcher
$controlCenter = noctalia msg panel-toggle control-center
$settings = noctalia msg settings-toggle
$clipboard = noctalia msg panel-toggle clipboard
$lock = noctalia msg session lock
$screenshot = grimblast --notify copysave

# ---------------------------------------------------------------------------
# Monitors (mirrors niri's output positions/scales)
# ---------------------------------------------------------------------------
monitor = HDMI-A-1, preferred, 0x0, 1
monitor = DP-1, preferred, 576x648, 1
monitor = eDP-1, preferred, 768x1728, 1.25
# Fallback for anything not listed above (e.g. a VM or a newly attached screen).
monitor = , preferred, auto, 1

# ---------------------------------------------------------------------------
# Environment and autostart
# ---------------------------------------------------------------------------
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_SIZE,24

exec-once = noctalia
exec-once = fcitx5 -d
# Xwayland starts with a US keymap; X11 apps read this instead.
exec-once = setxkbmap jp

# ---------------------------------------------------------------------------
# Input
# ---------------------------------------------------------------------------
input {
    kb_layout = jp
    repeat_delay = 300
    repeat_rate = 30
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        disable_while_typing = true
    }
}

# Three-finger horizontal swipe switches workspaces.
gesture = 3, horizontal, workspace

# ---------------------------------------------------------------------------
# Layout and decoration (niri: gaps 2, 1px focus ring, rounding 10)
# ---------------------------------------------------------------------------
general {
    gaps_in = 2
    gaps_out = 2
    border_size = 1
    col.active_border = rgba(7fc8ffff)
    col.inactive_border = rgba(505050ff)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = windows, 1, 5, easeOutQuint
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default
    animation = layers, 1, 3, default
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ---------------------------------------------------------------------------
# Window and layer rules
# ---------------------------------------------------------------------------
# Match niri's 0.90 opacity for VS Code and Rider.
windowrule = opacity 0.90 0.90, match:class ^(code)$
windowrule = opacity 0.90 0.90, match:class ^(jetbrains-rider)$

# Noctalia's settings window is floating, like in niri.
windowrule = float on, match:class ^(dev\.noctalia\.Noctalia)$

# yazi launched by xdg-desktop-portal-termfilechooser.
windowrule = float on, match:title ^(termfilechooser)$
windowrule = size 60% 60%, match:title ^(termfilechooser)$
windowrule = center on, match:title ^(termfilechooser)$

# Noctalia animates its own layers; don't let Hyprland animate them twice.
layerrule = no_anim on, match:namespace ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
# Blur noctalia's bar/panels (not its wallpaper layers).
layerrule = blur on, blur_popups on, ignore_alpha 0.5, match:namespace ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$

# ---------------------------------------------------------------------------
# 1. Applications
# ---------------------------------------------------------------------------
bind = $mainMod, Return, exec, $terminal #"Terminal (kitty)"
bind = $mainMod, D, exec, $launcher #"App launcher"
bind = $mainMod, E, exec, $fileManager #"File manager (yazi)"
bind = $mainMod, S, exec, $controlCenter #"Control center"
bind = $mainMod, comma, exec, $settings #"Noctalia settings"
bind = $mainMod, V, exec, $clipboard #"Clipboard history"
bind = $mainMod SHIFT, L, exec, $lock #"Lock screen"

# Shortcut cheatsheet (Noctalia community plugin; niri's hotkey overlay equivalent).
bind = $mainMod SHIFT, slash, exec, noctalia msg panel-toggle kenn/keybind-cheatsheet:cheatsheet #"Shortcut cheatsheet"

# ---------------------------------------------------------------------------
# 2. Window actions
# ---------------------------------------------------------------------------
bind = $mainMod, Q, killactive #"Close window"
bind = $mainMod SHIFT, E, exit #"Exit Hyprland"
bind = $mainMod SHIFT, V, togglefloating #"Toggle floating"
bind = $mainMod, P, pseudo #"Pseudo-tile"
bind = $mainMod, F, fullscreen #"Fullscreen"
bind = $mainMod SHIFT, F, fullscreen, 1 #"Maximize"
bind = $mainMod, C, centerwindow #"Center window"

# Scratchpad (standard Hyprland special workspace).
bind = $mainMod, grave, togglespecialworkspace, magic #"Toggle scratchpad"
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic #"Move to scratchpad"

# ---------------------------------------------------------------------------
# 3. Focus
# ---------------------------------------------------------------------------
bind = $mainMod, H, movefocus, l #"Focus left"
bind = $mainMod, L, movefocus, r #"Focus right"
bind = $mainMod, K, movefocus, u #"Focus up"
bind = $mainMod, J, movefocus, d #"Focus down"
bind = $mainMod, left, movefocus, l #"Focus left"
bind = $mainMod, right, movefocus, r #"Focus right"
bind = $mainMod, up, movefocus, u #"Focus up"
bind = $mainMod, down, movefocus, d #"Focus down"

# 4. Monitor
bind = $mainMod ALT, H, focusmonitor, l #"Focus monitor left"
bind = $mainMod ALT, L, focusmonitor, r #"Focus monitor right"
bind = $mainMod ALT, K, focusmonitor, u #"Focus monitor up"
bind = $mainMod ALT, J, focusmonitor, d #"Focus monitor down"
bind = $mainMod ALT, left, focusmonitor, l #"Focus monitor left"
bind = $mainMod ALT, right, focusmonitor, r #"Focus monitor right"
bind = $mainMod ALT, up, focusmonitor, u #"Focus monitor up"
bind = $mainMod ALT, down, focusmonitor, d #"Focus monitor down"

# Move the active window to the monitor in that direction.
bind = $mainMod ALT SHIFT, H, movewindow, mon:l #"Move window to monitor left"
bind = $mainMod ALT SHIFT, L, movewindow, mon:r #"Move window to monitor right"
bind = $mainMod ALT SHIFT, K, movewindow, mon:u #"Move window to monitor up"
bind = $mainMod ALT SHIFT, J, movewindow, mon:d #"Move window to monitor down"
bind = $mainMod ALT SHIFT, left, movewindow, mon:l #"Move window to monitor left"
bind = $mainMod ALT SHIFT, right, movewindow, mon:r #"Move window to monitor right"
bind = $mainMod ALT SHIFT, up, movewindow, mon:u #"Move window to monitor up"
bind = $mainMod ALT SHIFT, down, movewindow, mon:d #"Move window to monitor down"

# ---------------------------------------------------------------------------
# 5. Move windows
# ---------------------------------------------------------------------------
bind = $mainMod SHIFT, H, movewindow, l #"Move window left"
bind = $mainMod SHIFT, L, movewindow, r #"Move window right"
bind = $mainMod SHIFT, K, movewindow, u #"Move window up"
bind = $mainMod SHIFT, J, movewindow, d #"Move window down"
bind = $mainMod SHIFT, left, movewindow, l #"Move window left"
bind = $mainMod SHIFT, right, movewindow, r #"Move window right"
bind = $mainMod SHIFT, up, movewindow, u #"Move window up"
bind = $mainMod SHIFT, down, movewindow, d #"Move window down"

# ---------------------------------------------------------------------------
# 6. Workspaces
# ---------------------------------------------------------------------------
bind = $mainMod, 1, workspace, 1 #"Workspace 1"
bind = $mainMod, 2, workspace, 2 #"Workspace 2"
bind = $mainMod, 3, workspace, 3 #"Workspace 3"
bind = $mainMod, 4, workspace, 4 #"Workspace 4"
bind = $mainMod, 5, workspace, 5 #"Workspace 5"
bind = $mainMod, 6, workspace, 6 #"Workspace 6"
bind = $mainMod, 7, workspace, 7 #"Workspace 7"
bind = $mainMod, 8, workspace, 8 #"Workspace 8"
bind = $mainMod, 9, workspace, 9 #"Workspace 9"
bind = $mainMod, 0, workspace, 10 #"Workspace 10"

bind = $mainMod SHIFT, 1, movetoworkspace, 1 #"Move to workspace 1"
bind = $mainMod SHIFT, 2, movetoworkspace, 2 #"Move to workspace 2"
bind = $mainMod SHIFT, 3, movetoworkspace, 3 #"Move to workspace 3"
bind = $mainMod SHIFT, 4, movetoworkspace, 4 #"Move to workspace 4"
bind = $mainMod SHIFT, 5, movetoworkspace, 5 #"Move to workspace 5"
bind = $mainMod SHIFT, 6, movetoworkspace, 6 #"Move to workspace 6"
bind = $mainMod SHIFT, 7, movetoworkspace, 7 #"Move to workspace 7"
bind = $mainMod SHIFT, 8, movetoworkspace, 8 #"Move to workspace 8"
bind = $mainMod SHIFT, 9, movetoworkspace, 9 #"Move to workspace 9"
bind = $mainMod SHIFT, 0, movetoworkspace, 10 #"Move to workspace 10"

# niri's Mod+Ctrl+num / Mod+Ctrl+U/I muscle memory.
bind = $mainMod CTRL, 1, movetoworkspace, 1 #"Move to workspace 1"
bind = $mainMod CTRL, 2, movetoworkspace, 2 #"Move to workspace 2"
bind = $mainMod CTRL, 3, movetoworkspace, 3 #"Move to workspace 3"
bind = $mainMod CTRL, 4, movetoworkspace, 4 #"Move to workspace 4"
bind = $mainMod CTRL, 5, movetoworkspace, 5 #"Move to workspace 5"
bind = $mainMod CTRL, 6, movetoworkspace, 6 #"Move to workspace 6"
bind = $mainMod CTRL, 7, movetoworkspace, 7 #"Move to workspace 7"
bind = $mainMod CTRL, 8, movetoworkspace, 8 #"Move to workspace 8"
bind = $mainMod CTRL, 9, movetoworkspace, 9 #"Move to workspace 9"
bind = $mainMod CTRL, 0, movetoworkspace, 10 #"Move to workspace 10"
bind = $mainMod CTRL, U, movetoworkspace, e+1 #"Move to next workspace"
bind = $mainMod CTRL, I, movetoworkspace, e-1 #"Move to previous workspace"

bind = $mainMod, U, workspace, e+1 #"Next workspace"
bind = $mainMod, I, workspace, e-1 #"Previous workspace"
bind = $mainMod, Page_Down, workspace, e+1 #"Next workspace"
bind = $mainMod, Page_Up, workspace, e-1 #"Previous workspace"
bind = $mainMod SHIFT, Page_Down, movetoworkspace, e+1 #"Move to next workspace"
bind = $mainMod SHIFT, Page_Up, movetoworkspace, e-1 #"Move to previous workspace"

# Scroll through workspaces (niri: Mod+WheelScrollDown/Up).
bind = $mainMod, mouse_down, workspace, e+1 #"Next workspace (wheel)"
bind = $mainMod, mouse_up, workspace, e-1 #"Previous workspace (wheel)"
bind = $mainMod SHIFT, mouse_down, movefocus, r #"Focus right (wheel)"
bind = $mainMod SHIFT, mouse_up, movefocus, l #"Focus left (wheel)"

# Move/resize with the mouse.
bindm = $mainMod, mouse:272, movewindow #"Move window with mouse"
bindm = $mainMod, mouse:273, resizewindow #"Resize window with mouse"

# ---------------------------------------------------------------------------
# 7. Keyboard resize
# ---------------------------------------------------------------------------
binde = $mainMod, minus, resizeactive, -20 0 #"Shrink width"
binde = $mainMod, equal, resizeactive, 20 0 #"Grow width"
binde = $mainMod SHIFT, minus, resizeactive, 0 20 #"Grow height"
binde = $mainMod SHIFT, equal, resizeactive, 0 -20 #"Shrink height"

# ---------------------------------------------------------------------------
# 8. Screenshots
# ---------------------------------------------------------------------------
bind = , Print, exec, $screenshot area #"Screenshot area"
bind = CTRL, Print, exec, $screenshot output #"Screenshot output"
bind = ALT, Print, exec, $screenshot active #"Screenshot active window"

# ---------------------------------------------------------------------------
# 9. Media/brightness keys (work while locked)
# ---------------------------------------------------------------------------
bindel = , XF86AudioRaiseVolume, exec, noctalia msg volume-up #"Volume up"
bindel = , XF86AudioLowerVolume, exec, noctalia msg volume-down #"Volume down"
bindl = , XF86AudioMute, exec, noctalia msg volume-mute #"Mute audio"
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle #"Mute microphone"
bindel = , XF86MonBrightnessUp, exec, noctalia msg brightness-up #"Brightness up"
bindel = , XF86MonBrightnessDown, exec, noctalia msg brightness-down #"Brightness down"

# ---------------------------------------------------------------------------
# Submaps (modes)
# ---------------------------------------------------------------------------
# 10. Resize mode
bind = $mainMod, R, submap, resize #"Resize mode"
submap = resize
binde = , H, resizeactive, -20 0 #"Shrink width"
binde = , L, resizeactive, 20 0 #"Grow width"
binde = , K, resizeactive, 0 -20 #"Shrink height"
binde = , J, resizeactive, 0 20 #"Grow height"
binde = , left, resizeactive, -20 0 #"Shrink width"
binde = , right, resizeactive, 20 0 #"Grow width"
binde = , up, resizeactive, 0 -20 #"Shrink height"
binde = , down, resizeactive, 0 20 #"Grow height"
bind = , Escape, submap, reset #"Leave resize mode"
bind = , Return, submap, reset #"Leave resize mode"
bind = $mainMod, R, submap, reset #"Leave resize mode"
submap = reset

# 11. Move mode
bind = $mainMod, M, submap, move #"Move mode"
submap = move
bind = , H, movewindow, l #"Move window left"
bind = , L, movewindow, r #"Move window right"
bind = , K, movewindow, u #"Move window up"
bind = , J, movewindow, d #"Move window down"
bind = , left, movewindow, l #"Move window left"
bind = , right, movewindow, r #"Move window right"
bind = , up, movewindow, u #"Move window up"
bind = , down, movewindow, d #"Move window down"
bind = , Escape, submap, reset #"Leave move mode"
bind = , Return, submap, reset #"Leave move mode"
bind = $mainMod, M, submap, reset #"Leave move mode"
submap = reset

# 12. System mode
bind = $mainMod, Escape, submap, system #"System mode"
submap = system
bind = , L, exec, $lock #"Lock screen"
bind = , E, exec, hyprctl dispatch exit #"Log out"
bind = , S, exec, systemctl suspend #"Suspend"
bind = , R, exec, systemctl reboot #"Reboot"
bind = , P, exec, systemctl poweroff #"Power off"
bind = , Escape, submap, reset #"Leave system mode"
bind = , Return, submap, reset #"Leave system mode"
bind = $mainMod, Escape, submap, reset #"Leave system mode"
submap = reset
